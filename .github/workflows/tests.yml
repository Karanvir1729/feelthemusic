name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      # Spatial-model typing gaps are documented in QUALITY_AUDIT.md, not suppressed.
      - run: python -m mypy lamp/sdk.py
      - run: python -m pytest
      - run: python -m pytest lamp/live/tests
