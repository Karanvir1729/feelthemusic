[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Correctness first; do not churn teammates' formatting during integration.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["(^|/)tests/"]
